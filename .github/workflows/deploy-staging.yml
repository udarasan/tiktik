# Deploys the backend to the STAGING Supabase project on every push to develop
# (CONTRIBUTING.md: develop → staging). Skips cleanly until staging secrets exist.
#
# Repository → Settings → Environments → "staging" → secrets:
#   SUPABASE_ACCESS_TOKEN   personal access token for the Supabase CLI
#   SUPABASE_PROJECT_REF    staging project ref (e.g. abcdefghijklmnop)
#   SUPABASE_DB_PASSWORD    staging database password
#
# Frontend hosting (Vercel / Netlify / Cloudflare Pages) is chosen and added in M9.
name: deploy-staging

on:
  push:
    branches: [develop]
    paths:
      - 'backend/supabase/migrations/**'
      - 'backend/supabase/functions/**'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 3.4.0

jobs:
  backend:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check staging secrets
        id: secrets
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_PROJECT_REF" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "::notice title=Staging deploy skipped::Staging secrets are not configured yet (see the header of deploy-staging.yml)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: steps.secrets.outputs.ready == 'true'
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Link staging project
        if: steps.secrets.outputs.ready == 'true'
        working-directory: backend
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes

      # CLI 3.x: `db push` targets the LOCAL database unless --remote is given.
      - name: Push migrations
        if: steps.secrets.outputs.ready == 'true'
        working-directory: backend
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Deploy Edge Functions
        if: steps.secrets.outputs.ready == 'true' && hashFiles('backend/supabase/functions/*/index.ts') != ''
        working-directory: backend
        run: supabase functions deploy --yes

      - name: Advisors on staging (report only)
        if: steps.secrets.outputs.ready == 'true'
        continue-on-error: true
        working-directory: backend
        run: supabase db advisors --remote --level warn
